name: EDoctor mobile performance
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3109
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-local-reports
          path: |
            .lighthouseci/
            lighthouse-reports/
