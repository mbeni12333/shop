name: EDoctor checks and release
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edoctor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck && npm test
      - run: npm run catalog:audit
      - run: npm run seed:check
      - run: php -l wordpress/edoctor-bridge/edoctor-bridge.php
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:catalog
      - run: npm run test:research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
  image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEILI_URL=${{ vars.NEXT_PUBLIC_MEILI_URL }}
            NEXT_PUBLIC_MEILI_SEARCH_KEY=${{ vars.NEXT_PUBLIC_MEILI_SEARCH_KEY }}
            NEXT_PUBLIC_WHATSAPP=${{ vars.NEXT_PUBLIC_WHATSAPP }}
            NEXT_PUBLIC_PHONE=${{ vars.NEXT_PUBLIC_PHONE }}
            IMAGE_HOSTS=${{ vars.IMAGE_HOSTS }}
  production:
    if: github.event_name != 'pull_request'
    needs: image
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the exact verified image via Coolify API
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_SEARCH_WORKER_UUID: ${{ secrets.COOLIFY_SEARCH_WORKER_UUID }}
          RELEASE_TAG: ${{ github.sha }}
        run: |
          test -n "$COOLIFY_API_URL" && test -n "$COOLIFY_TOKEN" && test -n "$COOLIFY_RESOURCE_UUID" && test -n "$COOLIFY_SEARCH_WORKER_UUID"
          for RESOURCE_UUID in "$COOLIFY_RESOURCE_UUID" "$COOLIFY_SEARCH_WORKER_UUID"; do
            curl --fail-with-body --silent --show-error --request PATCH "$COOLIFY_API_URL/applications/$RESOURCE_UUID" --header "Authorization: Bearer $COOLIFY_TOKEN" --header 'Content-Type: application/json' --data "{\"docker_registry_image_tag\":\"$RELEASE_TAG\"}"
          done
          for RESOURCE_UUID in "$COOLIFY_RESOURCE_UUID" "$COOLIFY_SEARCH_WORKER_UUID"; do
            curl --fail-with-body --silent --show-error "$COOLIFY_API_URL/deploy?uuid=$RESOURCE_UUID&force=false" --header "Authorization: Bearer $COOLIFY_TOKEN"
          done
